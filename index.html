<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>網頁標題 (Title)12356454</title>
</head>

<body>
    <h1>歡迎來到我的網站！</h1>
    <p>這是一個示例網頁。</p>
    <div>123</div>
    <div>456</div>
    <span>789</span>
    <span>1011</span>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTw2HXTvfonhdE8eUprkWI4UK74wPy2fvrAaIPa7HBqTqJDPD47OF9tEFwODf9gRHR2ONyjlvlwKI9cc3QV2qhFgaNs0Ct792Vqt4v_wg&s=10"
        alt="">
    <a href="https://www.google.com">Google</a>
    <br />
    <!-- 常用輸入元件示範 -->
    <input type="text" placeholder="請輸入姓名" />
    <input type="number" placeholder="請輸入數字" />
    <input type="password" placeholder="請輸入密碼" />
    <input type="tel" placeholder="請輸入數字" />
    <input type="email" placeholder="請輸入email" />

    <!-- 單選互斥 (相同 name) -->
    <label><input type="radio" name="gender" value="m" /> 男</label>
    <label><input type="radio" name="gender" value="f" /> 女</label>

    <!-- 多選核取方塊 -->
    <label><input type="checkbox" name="fruit" value="apple" /> 蘋果</label>
    <label><input type="checkbox" name="fruit" value="banana" /> 香蕉</label>

    <!-- 多行文字框與下拉選單 -->
    <textarea placeholder="備註說明..."></textarea>
    <button type="submit">送出資料</button>

    <input type="file" />
    <input type="date" placeholder=”請選擇日期” />

    <select>
        <option>下拉選單</option>
        <option>選項1</option>
        <option>選項2</option>
    </select>

</body>

</html>
